<svg xmlns="http://www.w3.org/2000/svg" width="300" height="432" viewBox="0 0 300 432" role="img" aria-labelledby="title desc">
  <title id="title">Book cover placeholder</title>
  <desc id="desc">A dark red book cover placeholder inspired by the template.</desc>
  <defs>
    <linearGradient id="cover" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#321713"/>
      <stop offset="0.5" stop-color="#5a211b"/>
      <stop offset="1" stop-color="#21100f"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="300" height="432" rx="2" fill="url(#cover)" filter="url(#grain)"/>
  <rect x="44" y="84" width="212" height="1.5" fill="#8b6b43" opacity="0.45"/>
  <rect x="44" y="246" width="212" height="1.5" fill="#8b6b43" opacity="0.45"/>
  <text x="150" y="118" text-anchor="middle" fill="#8b6b43" font-family="Georgia, serif" font-size="17" letter-spacing="2">THE</text>
  <text x="150" y="155" text-anchor="middle" fill="#8b6b43" font-family="Georgia, serif" font-size="31" letter-spacing="5">LIBRARY</text>
  <text x="150" y="194" text-anchor="middle" fill="#8b6b43" font-family="Georgia, serif" font-size="27" letter-spacing="5">BOOK</text>
  <text x="150" y="226" text-anchor="middle" fill="#8b6b43" font-family="Georgia, serif" font-size="12" letter-spacing="2">PLACEHOLDER</text>
  <text x="150" y="346" text-anchor="middle" fill="#9a7850" font-family="Georgia, serif" font-style="italic" font-size="18">Template Image</text>
</svg>
